<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>손끝 한 줄 · 점자 읽기</title><link rel="icon" href="data:,"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="{{ url_for('static', filename='braille.js') }}" defer></script></head>
<body class="touch-page">
<main class="touch-main">
  <p class="touch-place" id="place" aria-live="polite"></p>
  <canvas id="board" width="720" height="420" role="img" aria-label="어두운 화면 위 물건 실루엣. 문지른 곳의 점자 점이 드러납니다."></canvas>
  <p class="touch-progress" id="progress"></p>
  <div class="touch-actions"><button type="button" id="next" hidden>다음</button></div>

  <section class="mini-panel" aria-label="서버 음성">
    <canvas id="wave" width="600" height="70" aria-hidden="true"></canvas>
    <p class="mini-caption" id="caption" aria-live="polite"></p>
    <p class="mini-metrics"><span id="m-time">생성 —</span> · <span id="m-dur">길이 —</span> · <span id="m-size">크기 —</span> · <span class="ai">AI 합성 음성</span></p>
  </section>

  <div class="touch-overlay" id="start">
    <div>
      <h1>손끝 한 줄</h1>
      <p>점자는 손끝으로 읽는 문자입니다. 화면을 손가락이나 마우스로 문질러 보세요. 짚은 곳의 점이 드러나고, 한 글자의 점이 다 드러나면 그 글자를 소리로 읽어 줍니다.</p>
      <button type="button" id="begin">시작</button>
      <p class="small">엘리베이터 버튼, 캔 음료, 화장실 표지판에 실제로 쓰이는 점자입니다. 목소리는 서버가 만든 AI 합성 음성입니다.</p>
    </div>
  </div>
  <div class="touch-overlay" id="finish" hidden>
    <div>
      <h1>다 읽었습니다</h1>
      <p>엘리베이터, 캔 음료, 화장실처럼 점자는 생활 곳곳에 있습니다.</p>
      <button type="button" id="again">처음부터</button>
      <p class="small"><a href="/tts">서버 TTS 페이지</a> · <a href="/">사진 실험실</a></p>
    </div>
  </div>
</main>
<script id="items" type="application/json">{{ items|tojson }}</script>
</body>
</html>
